name: Publish Frontend to GHCR

on:
  push:
    branches:
      - main
      - dev
      - refactor/gps-tracking
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Vite build secrets
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::error::Define secret VITE_API_BASE_URL"
            exit 1
          fi
          if [ -z "${VITE_GOOGLE_MAPS_API_KEY:-}" ]; then
            echo "::error::Define secret VITE_GOOGLE_MAPS_API_KEY"
            exit 1
          fi

      - name: Set image and tags
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          BRANCH_TAG="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=$BRANCH_TAG" >> "$GITHUB_ENV"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_GOOGLE_MAPS_MAP_ID=${{ secrets.VITE_GOOGLE_MAPS_MAP_ID != '' && secrets.VITE_GOOGLE_MAPS_MAP_ID || 'DEMO_MAP_ID' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.BRANCH_TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Add latest tag on main
        if: github.ref_name == 'main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_GOOGLE_MAPS_MAP_ID=${{ secrets.VITE_GOOGLE_MAPS_MAP_ID != '' && secrets.VITE_GOOGLE_MAPS_MAP_ID || 'DEMO_MAP_ID' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest

      - name: Dispatch deploy production (main)
        if: github.ref_name == 'main'
        env:
          DISPATCH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $DISPATCH_TOKEN" \
            https://api.github.com/repos/LuisaVargas-9/Muni-infra/dispatches \
            -d @- <<EOF
          {
            "event_type": "frontend-published",
            "client_payload": {
              "environment": "production",
              "component": "frontend",
              "branch": "${{ github.ref_name }}",
              "image": "${{ env.IMAGE_NAME }}:${{ env.BRANCH_TAG }}"
            }
          }
          EOF

      - name: Dispatch deploy dev (dev)
        if: github.ref_name == 'dev'
        env:
          DISPATCH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $DISPATCH_TOKEN" \
            https://api.github.com/repos/LuisaVargas-9/Muni-infra/dispatches \
            -d @- <<EOF
          {
            "event_type": "frontend-published",
            "client_payload": {
              "environment": "dev",
              "component": "frontend",
              "branch": "${{ github.ref_name }}",
              "image": "${{ env.IMAGE_NAME }}:${{ env.BRANCH_TAG }}"
            }
          }
          EOF

      - name: Dispatch deploy test (refactor/gps-tracking)
        if: github.ref_name == 'refactor/gps-tracking'
        env:
          DISPATCH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $DISPATCH_TOKEN" \
            https://api.github.com/repos/LuisaVargas-9/Muni-infra/dispatches \
            -d @- <<EOF
          {
            "event_type": "frontend-published",
            "client_payload": {
              "environment": "test",
              "component": "frontend",
              "branch": "${{ github.ref_name }}",
              "image": "${{ env.IMAGE_NAME }}:${{ env.BRANCH_TAG }}"
            }
          }
          EOF
