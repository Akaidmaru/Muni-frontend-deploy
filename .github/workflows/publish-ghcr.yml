# Publicación automática a GHCR en push a refactor/structure
# También se puede ejecutar manualmente desde Actions

name: Publish to GHCR

on:
  push:
    branches:
      - refactor/structure
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secrets de build (Vite)
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::error::Define el secret VITE_API_BASE_URL (p. ej. http://IP:3000)"
            exit 1
          fi
          if [ -z "${VITE_GOOGLE_MAPS_API_KEY:-}" ]; then
            echo "::error::Define el secret VITE_GOOGLE_MAPS_API_KEY (misma clave que usa el backend / Google Cloud)"
            exit 1
          fi

      - name: Nombre de imagen (minúsculas)
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
