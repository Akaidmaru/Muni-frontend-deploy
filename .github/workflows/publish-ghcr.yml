# Publicación manual a GHCR. Requiere secret VITE_API_BASE_URL (URL del API en producción).
# No despliega a EC2/Ansible. Ejecutar: Actions → "Publish to GHCR" → Run workflow.

name: Publish to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar VITE_API_BASE_URL
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::error::Define el secret del repositorio VITE_API_BASE_URL (p. ej. http://IP:3000)"
            exit 1
          fi

      - name: Nombre de imagen (minúsculas)
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
